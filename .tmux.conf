############################################################################
# prefix key
############################################################################
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix
bind-key -n C-q send-prefix

############################################################################
# configurations
############################################################################
set -g mouse on
set -g mode-keys vi
set -g escape-time 50
set -g repeat-time 100
set -g history-limit 100000
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

############################################################################
# pane management
############################################################################
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind n new-window

bind -n M-h previous-window
bind -n M-l next-window

set -g @smart-splits_resize_left_key 'C-Left'
set -g @smart-splits_resize_down_key 'C-Down'
set -g @smart-splits_resize_up_key 'C-Up'
set -g @smart-splits_resize_right_key 'C-Right'

############################################################################
# copy-mode
############################################################################
bind e copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

############################################################################
# Unbindings
############################################################################
unbind %

unbind [
unbind -T copy-mode-vi MouseDragEnd1Pane

############################################################################
# dracula
############################################################################
# general config
set -g @dracula-show-flags true
set -g @dracula-show-empty-plugins false
set -g @dracula-right-pad false
set -g @dracula-plugins "weather uptime network-public-ip cpu-arch rainbarf time"
set -g @dracula-time-format "%Z %F %a %R:%S "
set -g @dracula-refresh-rate 1
# resolved once at load from starship's [os.symbols] table, so the prompt and
# the status bar can never show different glyphs. .tmux.conf is symlinked into
# $HOME, so resolve back to the clone -- self-contained on purpose: run-shell
# ordering during config load is not guaranteed, so this cannot depend on an
# option set by another run.
run 'd=$(dirname "$(readlink "$HOME/.tmux.conf" || echo "$HOME/dotfiles/.tmux.conf")"); tmux set -g @os-icon "$("$d/scripts/tmux-os-icon.sh")"'
set -g @dracula-show-left-icon "#{@os-icon} #h"

# weather
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location false
set -g @dracula-weather-colors "dark_gray yellow"

# public ip
set -g @dracula-network-public-ip-label " 󰖟"
set -g @dracula-network-public-ip-colors "dark_gray light_purple"

# uptime
set -g @dracula-uptime-label " 󱎫"
set -g @dracula-uptime-colors "dark_gray green"

# arch
set -g @dracula-cpu-arch-label " "
set -g @dracula-cpu-arch-colors "dark_gray pink"

############################################################################
# TPM
############################################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'luftaquila/dracula-tmux'
set -g @plugin 'mrjones2014/smart-splits.nvim'

run '~/.tmux/plugins/tpm/tpm'

############################################################################
# status line performance
############################################################################
# tmux forks its single-threaded server once per distinct #(shell-command) in
# the status line on every status-interval tick, and each fork stalls the
# server ~12ms -- with dracula's six jobs that is a ~60-90ms freeze every
# second, felt as input stutter. tmux-status.sh moves those jobs out of the
# redraw path into one background process that pushes results into user
# options, so the bar keeps refreshing every second but forks nothing.
#
# "<command substring>=<seconds>", 0 = evaluate once (static value);
# anything unlisted keeps being evaluated every second.
set -g @status-refresh-overrides "cpu_arch=0"

run -b 'd=$(dirname "$(readlink "$HOME/.tmux.conf" || echo "$HOME/dotfiles/.tmux.conf")"); "$d/scripts/tmux-status.sh" >/dev/null 2>&1'

############################################################################
# colors
############################################################################
set -g pane-active-border-style fg=brightgreen
set -g pane-border-style fg=colour235
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[reverses,bold]#{repeat[ ,#{pane_width}]},#[fg=colour235]─}"

